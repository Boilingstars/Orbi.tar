[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbi-tar"
version = "0.1.0"
description = "Orbi.tar: a fixed-constellation environment for training agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "rich>=13.0",
]
console = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Boilingstars/HARMONY"
Repository = "https://github.com/Boilingstars/HARMONY"

[tool.setuptools]
packages = [
    "orbi",
    "example",
    "console",
    "console.api",
]

[tool.pytest.ini_options]
testpaths = ["orbi/tests", "example/tests", "console/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]
